<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIPCK Thika Diocese Management System - Events dashboard</title>
    <style>
        :root {
            --primary: #1e90ff;
            --background: #0a192f;
            --text: #ffffff;
            --muted: #8892b0;
            --border: #233554;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .page-shell {
            width: min(90%, 1200px);
            margin: 40px auto;
            border-radius: 8px;
            background: #07111f;
        }

        header {
            padding: 22px 30px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            background: #07111f;
        }

        .event-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .event-buttons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid rgba(30, 144, 255, 0.35);
            border-radius: 999px;
            background: rgba(30, 144, 255, 0.12);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: background-color 180ms ease, transform 180ms ease;
        }

        .event-buttons a:hover {
            background: rgba(30, 144, 255, 0.22);
            transform: translateY(-1px);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
        }

        nav {
            padding: 12px 30px;
            background: #07111f;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
        }

        main {
            padding: 20px 30px;
        }

        section {
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
        }
        .event-card {
            background: #0d2138;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;

        }
        </style>
</head>
<body>
    <header>
        <div class="event-buttons">
            <a href="closed-events.html">Closed Events</a>
            <a href="active-events.html">Active Events</a>
            <a href="archived-events.html">Archived Events</a>
        </div>
    </header>
</body>
</html>
